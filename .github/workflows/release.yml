name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          notes = []
          for section in re.split(r"^##[ \t]+", changelog, flags=re.MULTILINE)[1:]:
              heading, _, body = section.partition("\n")
              if re.fullmatch(r"\[" + re.escape(version) + r"\](?: - \d{4}-\d{2}-\d{2})?\s*", heading):
                  notes.append(body.strip())
          if len(notes) != 1 or not notes[0]:
              raise SystemExit(f"Expected one non-empty CHANGELOG.md section for [{version}].")
          Path("updates").mkdir(exist_ok=True)
          Path("updates/HomeBar-macOS-arm64.md").write_text(notes[0] + "\n", encoding="utf-8")
          PY

      - name: Validate signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in SPARKLE_PUBLIC_ED_KEY APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Set the $name repository variable."; exit 1; }
          done
          for name in SPARKLE_PRIVATE_KEY APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!name}" || { echo "Set the $name repository secret."; exit 1; }
          done

      - name: Test
        run: ./test.sh --build-system native --sdk "$(xcrun --show-sdk-path)"

      - name: Build Release
        run: ./build.sh

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/homebar-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/homebar-signing.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$CERTIFICATE"

      - name: Sign application and Sparkle
        run: |
          APP=".build/HomeBar.app"
          FRAMEWORK="$APP/Contents/Frameworks/Sparkle.framework"
          SPARKLE="$FRAMEWORK/Versions/B"
          lipo "$APP/Contents/MacOS/HomeBar" -verify_arch arm64
          xcrun vtool -show-build "$APP/Contents/MacOS/HomeBar" | tee "$RUNNER_TEMP/homebar-build-version.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          metadata = Path(os.environ["RUNNER_TEMP"], "homebar-build-version.txt").read_text()
          sdk = re.search(r"^\s*sdk (\d+)", metadata, re.MULTILINE)
          if sdk is None or int(sdk[1]) < 26:
              raise SystemExit("Expected macOS SDK 26 or later to preserve the native appearance.")
          PY
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$SPARKLE/XPCServices/Installer.xpc"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" --preserve-metadata=entitlements "$SPARKLE/XPCServices/Downloader.xpc"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$SPARKLE/Autoupdate"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$SPARKLE/Updater.app"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$FRAMEWORK"
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize application
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            .build/HomeBar.app "$RUNNER_TEMP/HomeBar-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/HomeBar-notarization.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notarization.json"
          cat "$RUNNER_TEMP/notarization.json"
          if ! python3 -c 'import json, sys; sys.exit(json.load(open(sys.argv[1]))["status"] != "Accepted")' "$RUNNER_TEMP/notarization.json"; then
            SUBMISSION_ID=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notarization.json")
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

      - name: Staple and package application
        run: |
          APP=".build/HomeBar.app"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          mkdir -p updates
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" updates/HomeBar-macOS-arm64.zip

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              --embed-release-notes \
              --maximum-deltas 0 updates
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          feed = ET.parse("updates/appcast.xml")
          enclosures = feed.findall("./channel/item/enclosure")
          signature = "{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"
          if len(enclosures) != 1 or not enclosures[0].get(signature):
              raise SystemExit("Expected one signed update. Check that the Sparkle keys match.")
          description = feed.find("./channel/item/description")
          notes = Path("updates/HomeBar-macOS-arm64.md").read_text(encoding="utf-8").strip()
          if description is None or (description.text or "").strip() != notes:
              raise SystemExit("Expected changelog release notes embedded in the update feed.")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            updates/HomeBar-macOS-arm64.zip
            updates/appcast.xml
          fail_on_unmatched_files: true
          body_path: updates/HomeBar-macOS-arm64.md
          draft: false
          make_latest: "true"
          generate_release_notes: false

      - name: Remove Apple signing credentials
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/homebar-signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/homebar-signing.p12" "$RUNNER_TEMP/HomeBar-notarization.zip"
