name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate update signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PUBLIC_ED_KEY" || { echo "Set the SPARKLE_PUBLIC_ED_KEY repository variable."; exit 1; }
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "Set the SPARKLE_PRIVATE_KEY repository secret."; exit 1; }

      - name: Test
        run: ./test.sh

      - name: Build Release
        run: ./build.sh

      - name: Package application
        run: |
          APP=".build/HomeBar.app"
          lipo "$APP/Contents/MacOS/HomeBar" -verify_arch arm64
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"

          mkdir -p updates
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" updates/HomeBar-macOS-arm64.zip

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              --maximum-deltas 0 updates
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          feed = ET.parse("updates/appcast.xml")
          enclosures = feed.findall("./channel/item/enclosure")
          signature = "{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"
          if len(enclosures) != 1 or not enclosures[0].get(signature):
              raise SystemExit("Expected one signed update. Check that the Sparkle keys match.")
          PY

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            updates/HomeBar-macOS-arm64.zip
            updates/appcast.xml
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: false
