<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A lightweight, native macOS menu bar dashboard for Home Assistant.">
    <link rel="canonical" href="https://homebar.jebrg.com/">
    <title>HomeBar - Home Assistant in your macOS menu bar</title>
    <link rel="stylesheet" href="style.css">
    <script src="screenshot.js" defer></script>
  </head>
  <body>
    <main>
      <div class="intro">
        <h1>HomeBar</h1>
        <p class="description">A lightweight, native macOS menu bar dashboard <span style="white-space: nowrap">for Home Assistant.</span></p>
        <div class="actions">
          <a class="button primary" href="https://github.com/jeromeberg/homebar/releases/latest">Download for macOS</a>
          <a class="button secondary" href="https://github.com/jeromeberg/homebar/">View on GitHub</a>
        </div>
        <p class="compatibility">Requires macOS 14 (Sonoma) or later. Apple Silicon.</p>
      </div>
      <div class="dashboard">
        <img src="light.png" width="772" height="1152" alt="HomeBar dashboard">
        <button class="screenshot-toggle" type="button" aria-label="Dark screenshot" aria-pressed="false" hidden>
          <span class="sun" aria-hidden="true"></span>
          <span class="moon" aria-hidden="true"></span>
        </button>
      </div>
    </main>
    <footer>Copyright © 2026 Jerome Berg</footer>
  </body>
</html>
